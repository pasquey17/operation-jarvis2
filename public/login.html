<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JARVIS · Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: #050a14;
      color: #fff;
      font-family: "Outfit", system-ui, sans-serif;
      overflow: hidden;
    }

    canvas#login-particles {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    .login-wrap {
      position: relative;
      z-index: 1;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(0, 212, 255, 0.15);
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 0 60px rgba(0, 212, 255, 0.08);
    }

    /* ── Typography ── */
    .login-eyebrow {
      font-family: "Share Tech Mono", "Courier New", monospace;
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #00d4ff;
      text-align: center;
      margin-bottom: 20px;
    }

    .login-headline {
      font-family: "Outfit", sans-serif;
      font-weight: 300;
      font-size: 32px;
      line-height: 1.15;
      color: #ffffff;
      text-align: center;
      margin-bottom: 10px;
    }

    .login-sub {
      font-size: 13px;
      color: #8899aa;
      line-height: 1.55;
      text-align: center;
      margin-bottom: 32px;
    }

    /* ── Google button ── */
    .login-google-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      height: 48px;
      padding: 0 20px;
      border-radius: 10px;
      border: none;
      background: #ffffff;
      color: #1f1f1f;
      font-family: "Outfit", sans-serif;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
      transition: transform 0.18s ease, box-shadow 0.18s ease;
      white-space: nowrap;
    }

    .login-google-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
    }

    .login-google-btn:active:not(:disabled) {
      transform: translateY(0);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
    }

    .login-google-btn:disabled { opacity: 0.6; cursor: wait; }

    .login-google-icon {
      flex-shrink: 0;
      width: 18px;
      height: 18px;
    }

    /* ── Divider ── */
    .login-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 28px 0;
      font-family: "Share Tech Mono", monospace;
      font-size: 10px;
      letter-spacing: 0.2em;
      color: #8899aa;
      text-transform: uppercase;
    }

    .login-divider::before,
    .login-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: rgba(0, 212, 255, 0.1);
    }

    /* ── Magic link section ── */
    .login-magic-label {
      display: block;
      font-family: "Share Tech Mono", "Courier New", monospace;
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #00d4ff;
      margin-bottom: 10px;
    }

    .login-magic-input {
      display: block;
      width: 100%;
      height: 46px;
      border-radius: 10px;
      border: 1px solid rgba(0, 212, 255, 0.2);
      background: rgba(0, 0, 0, 0.35);
      color: #fff;
      padding: 0 14px;
      font-family: "Outfit", sans-serif;
      font-size: 14px;
      outline: none;
      margin-bottom: 10px;
      transition: border-color 0.18s, box-shadow 0.18s;
    }

    .login-magic-input::placeholder { color: rgba(255, 255, 255, 0.25); }

    .login-magic-input:focus {
      border-color: rgba(0, 212, 255, 0.5);
      box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.08);
    }

    .login-magic-hint {
      font-size: 12px;
      color: #8899aa;
      line-height: 1.45;
      text-align: center;
      margin: 0 0 10px;
      opacity: 0.85;
    }

    .login-magic-btn {
      display: block;
      width: 100%;
      height: 46px;
      border-radius: 10px;
      border: 1px solid rgba(0, 212, 255, 0.3);
      background: rgba(0, 212, 255, 0.07);
      color: #00d4ff;
      font-family: "Share Tech Mono", "Courier New", monospace;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.18s, border-color 0.18s;
    }

    .login-magic-btn:hover:not(:disabled) {
      background: rgba(0, 212, 255, 0.14);
      border-color: rgba(0, 212, 255, 0.5);
    }

    .login-magic-btn:disabled { opacity: 0.5; cursor: wait; }

    /* ── Status messages ── */
    .login-msg {
      margin-top: 16px;
      font-size: 12px;
      line-height: 1.5;
      min-height: 18px;
      text-align: center;
    }

    .login-msg--ok  { color: #00d4ff; }
    .login-msg--err { color: rgba(255, 90, 90, 0.95); }

    /* ── Spinner ── */
    .login-spinner {
      display: none;
      flex-shrink: 0;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(31, 31, 31, 0.25);
      border-top-color: #1f1f1f;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    .login-spinner.visible { display: inline-block; }

    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 480px) {
      .login-card { padding: 32px 24px; }
      .login-headline { font-size: 28px; }
    }
  </style>
</head>
<body>
  <canvas id="login-particles" aria-hidden="true"></canvas>

  <div class="login-wrap">
    <div class="login-card" id="login-card">

      <div class="login-eyebrow">JARVIS · TRADING OS</div>
      <h1 class="login-headline">Create account or sign in</h1>
      <p class="login-sub">Your journal, intelligence, and coach — secured to your account</p>

      <button type="button" class="login-google-btn" id="google-btn">
        <span id="google-spinner" class="login-spinner" aria-hidden="true"></span>
        <svg class="login-google-icon" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M17.64 9.205c0-.639-.057-1.252-.164-1.841H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615Z" fill="#4285F4"/>
          <path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18Z" fill="#34A853"/>
          <path d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332Z" fill="#FBBC05"/>
          <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58Z" fill="#EA4335"/>
        </svg>
        <span id="google-btn-text">Continue with Google</span>
      </button>

      <div class="login-divider">or</div>

      <label class="login-magic-label" for="magic-email">Email</label>
      <input class="login-magic-input" id="magic-email" type="email" autocomplete="email" placeholder="you@email.com" />
      <p class="login-magic-hint">New? Just enter your email — we'll create your account automatically.</p>
      <button type="button" class="login-magic-btn" id="magic-btn">Continue with email</button>

      <div id="login-success" class="login-msg login-msg--ok" role="status"></div>
      <div id="login-error" class="login-msg login-msg--err" role="alert"></div>

    </div>
  </div>

  <script type="module">
    import { getSupabaseClient, APP_HOME_PATH } from "/js/jarvis-auth.js";

    const sb = getSupabaseClient();
    const params = new URLSearchParams(window.location.search);
    const nextPath = params.get("next") || APP_HOME_PATH;

    const googleBtn = document.getElementById("google-btn");
    const googleBtnText = document.getElementById("google-btn-text");
    const googleSpinner = document.getElementById("google-spinner");
    const magicBtn = document.getElementById("magic-btn");
    const magicEmailInput = document.getElementById("magic-email");
    const successEl = document.getElementById("login-success");
    const errorEl = document.getElementById("login-error");

    function showSuccess(msg) {
      successEl.textContent = msg;
      errorEl.textContent = "";
    }

    function showError(msg) {
      errorEl.textContent = msg;
      successEl.textContent = "";
    }

    async function redirectIfSession() {
      const { data } = await sb.auth.getSession();
      if (data?.session) {
        window.location.replace(nextPath.startsWith("/") ? nextPath : APP_HOME_PATH);
        return true;
      }
      return false;
    }

    googleBtn.addEventListener("click", async () => {
      showError("");
      googleBtn.disabled = true;
      googleBtnText.textContent = "Redirecting…";
      googleSpinner.classList.add("visible");

      const { error } = await sb.auth.signInWithOAuth({
        provider: "google",
        options: {
          redirectTo: window.location.origin + "/login.html?next=" + encodeURIComponent(nextPath),
        },
      });

      if (error) {
        showError(error.message || "Google sign-in failed.");
        googleBtn.disabled = false;
        googleBtnText.textContent = "Continue with Google";
        googleSpinner.classList.remove("visible");
      }
    });

    magicBtn.addEventListener("click", async () => {
      showError("");
      const email = magicEmailInput.value.trim();
      if (!email) {
        showError("Enter your email first.");
        return;
      }

      magicBtn.disabled = true;
      const { error } = await sb.auth.signInWithOtp({
        email,
        options: {
          emailRedirectTo: window.location.origin + "/login.html?next=" + encodeURIComponent(nextPath),
          shouldCreateUser: true,
        },
      });
      magicBtn.disabled = false;

      if (error) {
        showError(error.message || "Could not send link.");
      } else {
        showSuccess("Check your inbox — click the link to sign in.");
      }
    });

    magicEmailInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") magicBtn.click();
    });

    void redirectIfSession();

    (function particles() {
      const canvas = document.getElementById("login-particles");
      const ctx = canvas.getContext("2d");
      const pts = [];
      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      resize();
      window.addEventListener("resize", resize);
      for (let i = 0; i < 55; i++) {
        pts.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          r: Math.random() * 1.2 + 0.3,
          vx: (Math.random() - 0.5) * 0.25,
          vy: (Math.random() - 0.5) * 0.25,
          a: Math.random() * 0.4 + 0.1,
        });
      }
      function frame() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (const p of pts) {
          p.x += p.vx;
          p.y += p.vy;
          if (p.x < 0) p.x = canvas.width;
          if (p.x > canvas.width) p.x = 0;
          if (p.y < 0) p.y = canvas.height;
          if (p.y > canvas.height) p.y = 0;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = "rgba(0,212,255," + p.a + ")";
          ctx.fill();
        }
        requestAnimationFrame(frame);
      }
      frame();
    })();
  </script>
</body>
</html>
